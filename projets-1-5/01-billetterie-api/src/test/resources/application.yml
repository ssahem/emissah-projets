# Les tests d'intégration utilisent un PostgreSQL Testcontainers : l'URL,
# l'utilisateur et le mot de passe sont fournis par @DynamicPropertySource.
spring:
  application:
    name: billetterie-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
