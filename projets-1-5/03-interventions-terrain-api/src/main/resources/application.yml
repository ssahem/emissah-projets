# ==============================================================================
#  application.yml — configuration PAR DÉFAUT (développement local)
#  Le profil "prod" (application-prod.yml) surcharge ces valeurs.
#  L'énoncé ne prévoit aucun utilisateur : l'API n'a ni authentification ni rôle.
# ==============================================================================

spring:
  application:
    name: interventions-terrain-api

  # PostgreSQL local : la base des interventions terrain existe déjà sur la machine.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interventions_terrain}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

  # Flyway : reconstruit le schéma puis charge les données de démonstration
  # (db/dev). Le profil "prod" surcharge et ne garde que db/migration.
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    # Aucune requête SQL pendant la sérialisation JSON.
    open-in-view: false
    hibernate:
      # Hibernate vérifie le schéma issu de Flyway, il ne le modifie jamais.
      ddl-auto: validate

  mvc:
    problemdetails:
      enabled: true

# Alerte quotidienne sur les compétences proches de l'expiration (F16).
interventions-terrain:
  alertes-competences:
    cron: "0 0 1 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
