services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suivi_scolaire
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans le fichier .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Aucun "ports" : la base n'est joignable que depuis le réseau Compose.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://db:5432/suivi_scolaire
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans le fichier .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
